<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>致我最爱的宝宝 - 520 专属浪漫</title>
    <style>
        /* 
         * =========================================
         * CSS 样式部分 - 视觉与动画定义
         * =========================================
         */

        :root {
            --primary-color: #ff7eb3;
            --secondary-color: #ff758c;
            --accent-color: #ffffff;
            --bg-color: #050505;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --font-main: "Microsoft YaHei", "PingFang SC", sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            /* 禁止文字选中，提升体验 */
            -webkit-user-drag: none;
            /* 禁止图片拖拽 */
        }

        body {
            background-color: var(--bg-color);
            color: var(--accent-color);
            font-family: var(--font-main);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            /* 隐藏滚动条 */
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* 全屏 Canvas 用于绘制粒子特效 */
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* 
         * UI 层 - 毛玻璃效果
         * 包含标题、倒计时和底部文字
         */
        .ui-layer {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 500px;
            text-align: center;
            pointer-events: none;
            /* 让点击事件穿透到 Canvas */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 80vh;
        }

        /* 顶部标题区域 */
        .header-section {
            margin-top: 20px;
            animation: fadeInDown 1.5s ease-out;
        }

        .header-section h1 {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: 5px;
            background: linear-gradient(to right, #ff9a9e, #fecfef);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(255, 126, 179, 0.5);
            margin-bottom: 10px;
        }

        .header-section p {
            font-size: 1rem;
            opacity: 0.8;
            letter-spacing: 2px;
        }

        /* 中间主要信息区域 */
        .main-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px;
            background: transparent;
            /* 改为透明 */
            backdrop-filter: none;
            /* 去掉毛玻璃效果 */
            -webkit-backdrop-filter: none;
            /* 去掉毛玻璃效果 */
            border: 1px solid rgba(255, 255, 255, 0.1);
            /* 可选：保留微弱的边框 */
            border-radius: 20px;
            box-shadow: none;
            /* 去掉阴影 */
            animation: scaleIn 2s ease-out;
            pointer-events: auto;
        }

        .countdown-box {
            margin-bottom: 20px;
        }

        .countdown-label {
            font-size: 0.9rem;
            color: #ffdde1;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .time-display {
            font-family: 'Courier New', Courier, monospace;
            font-size: 2rem;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 10px var(--primary-color);
        }

        .message-box {
            font-size: 1.2rem;
            line-height: 1.8;
            color: #fff;
            margin-top: 10px;
            padding: 0 10px;
        }

        .highlight-text {
            color: #ff7eb3;
            font-weight: bold;
            font-size: 1.4rem;
        }

        /* 底部版权或备注 */
        .footer-section {
            margin-bottom: 20px;
            font-size: 0.8rem;
            opacity: 0.6;
            animation: fadeInUp 1.5s ease-out;
        }

        /* 
         * 动画定义 
         */
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.8);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* 移动端适配调整 */
        @media (max-width: 480px) {
            .header-section h1 {
                font-size: 1.8rem;
            }

            .time-display {
                font-size: 1.5rem;
            }

            .message-box {
                font-size: 1rem;
            }
        }

        /* 背景照片轮播容器 */
        #photo-slideshow {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
        }

        .photo-slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 2s ease-in-out;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            filter: brightness(0.7) blur(2px);
        }

        .photo-slide.active {
            opacity: 1;
        }

        /* 照片轮播控制按钮 */
        .photo-controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 5;
            display: flex;
            gap: 10px;
            pointer-events: auto;
        }

        .photo-controls button {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }

        .photo-controls button:hover {
            background: rgba(255, 126, 179, 0.5);
            transform: scale(1.1);
        }

        /* 照片指示器 */
        .photo-indicators {
            position: absolute;
            bottom: 70px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 5;
            display: flex;
            gap: 8px;
            pointer-events: auto;
        }

        .photo-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .photo-indicator.active {
            background: #ff7eb3;
            transform: scale(1.2);
        }
    </style>
</head>

<body>

    <audio id="bg-music" src="a thonsand years.mp3" preload="auto" loop></audio>

    <div id="canvas-container"></div>
    <!-- 背景照片轮播 -->
    <div id="photo-slideshow">
        <!-- 照片会通过JS动态添加 -->
    </div>

    <!-- 照片轮播控制按钮 -->
    <div class="photo-controls">
        <button id="prev-btn">‹</button>
        <button id="next-btn">›</button>
    </div>

    <!-- 照片指示器 -->
    <div class="photo-indicators" id="photo-indicators">
        <!-- 指示器会通过JS动态添加 -->
    </div>

    <!-- 粒子特效画布 -->
    <div id="canvas-container">
        <canvas id="heartCanvas"></canvas>
    </div>

    <!-- UI 界面层 -->
    <div class="ui-layer">
        <div class="header-section">
            <h1>520 快乐</h1>
            <p>To My Dearest Baby</p>
        </div>

        <div class="main-content">
            <div class="countdown-box">
                <div class="countdown-label">相爱时长</div>
                <div class="time-display" id="timer">Loading...</div>
            </div>

            <div class="message-box">
                <p>遇见你，是我今生最美的意外。</p>
                <p>愿我们的爱，像这粒子般永恒。</p>
                <p class="highlight-text">宝宝，我爱你！</p>
            </div>
        </div>

        <div class="footer-section">
            <p>Created with Love & Code</p>
        </div>
    </div>

    <!-- 
     * =========================================
     * JavaScript 逻辑部分 - 核心引擎
     * =========================================
     -->
    <script>
        /**
     * 音频管理器 (AudioManager)
     * 解决浏览器自动播放限制
     */
        /**
   * 音频管理器 (AudioManager)
   * 解决浏览器自动播放限制
   */
        const AudioManager = {
            audio: null,

            // 初始化方法
            init: function () {
                // 1. 获取 audio 元素
                this.audio = document.getElementById('bg-music');

                // 如果页面上没有这个元素，直接返回
                if (!this.audio) return;

                // 2. 尝试自动播放（部分浏览器允许，大部分需要用户交互）
                // 这里我们在页面加载时尝试一次
                this.audio.play().catch(() => {
                    // 如果自动播放失败（通常会失败），什么都不做，等待用户点击
                    console.log('自动播放被浏览器拦截，等待用户点击...');
                });

                // 3. 监听用户的第一次点击（这是唤醒音频的关键）
                const resumeAudio = () => {
                    if (this.audio.paused) {
                        this.audio.play();
                    }
                    // 播放成功后，移除监听，避免重复触发
                    document.removeEventListener('click', resumeAudio);
                    document.removeEventListener('touchstart', resumeAudio);
                };

                document.addEventListener('click', resumeAudio);
                document.addEventListener('touchstart', resumeAudio);
            },

            // 播放方法
            play: function () {
                if (this.audio) this.audio.play();
            },

            // 暂停方法
            pause: function () {
                if (this.audio) this.audio.pause();
            }
        };

        // --- 页面加载完成后初始化 ---
        document.addEventListener('DOMContentLoaded', () => {
            AudioManager.init();
        });
        /**
         * 工具函数库 (Utils)
         * 包含数学计算、颜色处理等基础功能
         */
        const Utils = {
            // 生成 min 到 max 之间的随机数
            random: function (min, max) {
                return Math.random() * (max - min) + min;
            },

            // 生成随机整数
            randomInt: function (min, max) {
                return Math.floor(this.random(min, max));
            },

            // 角度转弧度
            degToRad: function (deg) {
                return deg * (Math.PI / 180);
            },

            // 计算两点距离
            getDistance: function (x1, y1, x2, y2) {
                let xDist = x2 - x1;
                let yDist = y2 - y1;
                return Math.sqrt(Math.pow(xDist, 2) + Math.pow(yDist, 2));
            },

            // 颜色混合
            colorBlend: function (c1, c2, ratio) {
                ratio = Math.max(Math.min(Number(ratio), 1), 0);
                let r1 = parseInt(c1.substring(1, 3), 16);
                let g1 = parseInt(c1.substring(3, 5), 16);
                let b1 = parseInt(c1.substring(5, 7), 16);
                let r2 = parseInt(c2.substring(1, 3), 16);
                let g2 = parseInt(c2.substring(3, 5), 16);
                let b2 = parseInt(c2.substring(5, 7), 16);
                let r = Math.round(r1 * (1 - ratio) + r2 * ratio);
                let g = Math.round(g1 * (1 - ratio) + g2 * ratio);
                let b = Math.round(b1 * (1 - ratio) + b2 * ratio);
                return '#' + ('0' + (r || 0).toString(16)).slice(-2) +
                    ('0' + (g || 0).toString(16)).slice(-2) +
                    ('0' + (b || 0).toString(16)).slice(-2);
            }
        };

        /**
         * 颜色管理器 (ColorManager)
         * 管理整个页面的调色板
         */
        const ColorManager = {
            palette: [
                '#ff7eb3', // 粉红
                '#ff758c', // 红
                '#ff9a9e', // 浅红
                '#fecfef', // 紫红
                '#a18cd1', // 紫
                '#fbc2eb'  // 亮粉
            ],

            getRandomColor: function () {
                return this.palette[Utils.randomInt(0, this.palette.length)];
            },

            getGradientColor: function (progress) {
                // 根据进度在调色板中插值
                const index = progress * (this.palette.length - 1);
                const lower = Math.floor(index);
                const upper = Math.ceil(index);
                const ratio = index - lower;

                if (upper >= this.palette.length) {
                    return this.palette[this.palette.length - 1];
                }
                return Utils.colorBlend(this.palette[lower], this.palette[upper], ratio);
            }
        };

        /**
         * 粒子类 (Particle)
         * 构成爱心和特效的基本单元
         */
        class Particle {
            constructor(x, y, z, type = 'heart') {
                this.x = x; // 3D 坐标
                this.y = y;
                this.z = z;

                this.originX = x; // 原始坐标用于复位
                this.originY = y;
                this.originZ = z;

                this.type = type; // 类型：爱心、背景、文字烟花

                // 视觉属性
                this.size = Utils.random(0.5, 2.5);
                this.color = ColorManager.getRandomColor();
                this.alpha = Utils.random(0.5, 1);

                // 动态属性
                this.vx = Utils.random(-0.5, 0.5);
                this.vy = Utils.random(-0.5, 0.5);
                this.vz = Utils.random(-0.5, 0.5);

                // 旋转属性
                this.angleX = 0;
                this.angleY = 0;

                // 目标位置（用于动画过渡）
                this.targetX = x;
                this.targetY = y;
                this.targetZ = z;
            }

            // 更新粒子状态
            update(centerX, centerY, rotationX, rotationY) {
                if (this.type === 'firework') {
                    // 烟花粒子：简单的物理扩散
                    this.x += this.vx;
                    this.y += this.vy;
                    this.z += this.vz;
                    this.alpha -= 0.02; // 逐渐消失
                    this.size *= 0.95;  // 逐渐变小
                } else {
                    // 爱心/背景粒子：3D 旋转逻辑
                    // 简单的 3D 旋转公式
                    let x = this.originX;
                    let y = this.originY;
                    let z = this.originZ;

                    // 绕 Y 轴旋转
                    let cosY = Math.cos(rotationY);
                    let sinY = Math.sin(rotationY);
                    let x1 = x * cosY - z * sinY;
                    let z1 = z * cosY + x * sinY;

                    // 绕 X 轴旋转
                    let cosX = Math.cos(rotationX);
                    let sinX = Math.sin(rotationX);
                    let y1 = y * cosX - z1 * sinX;
                    let z2 = z1 * cosX + y * sinX;

                    this.x = x1;
                    this.y = y1;
                    this.z = z2;

                    // 模拟微弱的浮动
                    this.x += Math.sin(Date.now() * 0.001 + this.originY) * 2;
                    this.y += Math.cos(Date.now() * 0.001 + this.originX) * 2;
                }
            }

            // 绘制粒子
            draw(ctx, width, height) {
                // 简单的透视投影
                const fov = 400; // 视场角
                const scale = fov / (fov + this.z);

                const x2d = this.x * scale + width / 2;
                const y2d = this.y * scale + height / 2;

                // 只有当粒子在摄像机前方时才绘制
                if (this.z > -fov + 10) {
                    ctx.globalAlpha = this.alpha * scale; // 越远越透明
                    ctx.fillStyle = this.color;

                    ctx.beginPath();
                    ctx.arc(x2d, y2d, this.size * scale, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }

        /**
         * 场景管理器 (SceneManager)
         * 管理所有粒子、动画循环和交互
         */
        class SceneManager {
            constructor() {
                this.canvas = document.getElementById('heartCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.width = window.innerWidth;
                this.height = window.innerHeight;

                this.particles = [];
                this.maxParticles = 1200; // 爱心粒子数量

                this.rotationX = 0;
                this.rotationY = 0;
                this.targetRotationX = 0;
                this.targetRotationY = 0;

                this.mouse = { x: 0, y: 0, isDown: false };

                this.init();
            }

            // 初始化
            init() {
                this.resize();
                this.createHeartParticles();
                this.createBackgroundStars();
                this.bindEvents();
                this.animate();
            }

            // 窗口大小调整
            resize() {
                this.width = window.innerWidth;
                this.height = window.innerHeight;
                this.canvas.width = this.width;
                this.canvas.height = this.height;
            }

            // 创建爱心形状的粒子
            createHeartParticles() {
                this.particles = []; // 清空

                // 爱心数学公式：
                // x = 16sin^3(t)
                // y = 13cos(t) - 5cos(2t) - 2cos(3t) - cos(4t)
                // z = random depth

                for (let i = 0; i < this.maxParticles; i++) {
                    let t = Utils.random(0, Math.PI * 2);
                    let scale = Utils.random(10, 18); // 爱心大小范围

                    // 计算 2D 爱心坐标
                    let x = 16 * Math.pow(Math.sin(t), 3);
                    let y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));

                    // 添加厚度，形成 3D 爱心体
                    let z = Utils.random(-10, 10);

                    // 随机散布在爱心表面或内部
                    let scatter = Utils.random(0.8, 1.2);

                    let p = new Particle(
                        x * scale * scatter,
                        y * scale * scatter,
                        z * scale
                    );
                    this.particles.push(p);
                }
            }

            // 创建背景星空
            createBackgroundStars() {
                const starCount = 200;
                for (let i = 0; i < starCount; i++) {
                    let x = Utils.random(-this.width, this.width);
                    let y = Utils.random(-this.height, this.height);
                    let z = Utils.random(0, 1000);

                    let star = new Particle(x, y, z, 'star');
                    star.size = Utils.random(0.5, 2);
                    star.alpha = Utils.random(0.2, 0.8);
                    star.color = '#ffffff';
                    this.particles.push(star);
                }
            }

            // 创建文字烟花
            createTextFirework(x, y, text) {
                const charCount = text.length * 5; // 每个字拆分成多个粒子

                for (let i = 0; i < charCount; i++) {
                    let p = new Particle(x, y, 0, 'firework');
                    p.color = ColorManager.getRandomColor();
                    p.size = Utils.random(2, 4);

                    // 爆炸速度
                    const angle = Utils.random(0, Math.PI * 2);
                    const speed = Utils.random(2, 10);
                    p.vx = Math.cos(angle) * speed;
                    p.vy = Math.sin(angle) * speed;
                    p.vz = Utils.random(-5, 5);

                    this.particles.push(p);
                }
            }

            // 绑定事件
            bindEvents() {
                window.addEventListener('resize', () => this.resize());

                // 鼠标/触摸移动控制旋转
                const handleMove = (e) => {
                    let clientX, clientY;
                    if (e.type === 'touchmove') {
                        clientX = e.touches[0].clientX;
                        clientY = e.touches[0].clientY;
                    } else {
                        clientX = e.clientX;
                        clientY = e.clientY;
                    }

                    this.mouse.x = clientX;
                    this.mouse.y = clientY;

                    // 根据鼠标位置计算目标旋转角度
                    this.targetRotationY = (clientX - this.width / 2) * 0.002;
                    this.targetRotationX = (clientY - this.height / 2) * 0.002;
                };

                window.addEventListener('mousemove', handleMove);
                window.addEventListener('touchmove', handleMove);

                // 点击产生烟花
                const handleClick = (e) => {
                    let clientX, clientY;
                    if (e.type === 'touchstart') {
                        clientX = e.changedTouches[0].clientX;
                        clientY = e.changedTouches[0].clientY;
                    } else {
                        clientX = e.clientX;
                        clientY = e.clientY;
                    }

                    // 随机一句情话
                    const messages = [
                        "宝宝我爱你", "520快乐", "永远在一起", "你是我的唯一",
                        "心动", "喜欢", "Sweet", "Love", "Marry Me", "Forever"
                    ];
                    const text = messages[Utils.randomInt(0, messages.length)];
                    this.createTextFirework(clientX - this.width / 2, clientY - this.height / 2, text);
                };

                window.addEventListener('click', handleClick);
                window.addEventListener('touchstart', handleClick);
            }

            // 动画循环
            animate() {
                requestAnimationFrame(() => this.animate());

                // 清除画布
                this.ctx.clearRect(0, 0, this.width, this.height);

                // 平滑旋转过渡
                this.rotationY += (this.targetRotationY - this.rotationY) * 0.05;
                this.rotationX += (this.targetRotationX - this.rotationX) * 0.05;

                // 自动缓慢自转
                this.rotationY += 0.005;

                // 更新并绘制所有粒子
                this.particles.forEach((p, index) => {
                    p.update(0, 0, this.rotationX, this.rotationY);
                    p.draw(this.ctx, this.width, this.height);

                    // 移除消失的烟花粒子
                    if (p.type === 'firework' && p.alpha <= 0) {
                        this.particles.splice(index, 1);
                    }
                });
            }
        }

        /**
         * 计时器逻辑 (Timer Logic)
         * 计算恋爱天数等
         */
        function initTimer() {
            // 设置开始恋爱的日期 (请根据实际情况修改)
            const startDate = new Date("2026-03-03");

            const timerEl = document.getElementById('timer');

            function update() {
                const now = new Date();
                const diff = now - startDate;

                const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((diff % (1000 * 60)) / 1000);

                timerEl.innerHTML = `${days} 天 ${hours} 时 ${minutes} 分 ${seconds} 秒`;
            }

            setInterval(update, 1000);
            update();
        }

        /**
         * 音频管理器 (AudioManager) - 可选背景音乐
         * 注意：由于浏览器自动播放策略，通常需要用户交互后才能播放
         */
        //
        /**
     * 照片轮播管理器 (PhotoSlideshow)
     * 管理背景照片的轮播
     */
        class PhotoSlideshow {
            constructor() {
                this.container = document.getElementById('photo-slideshow');
                this.indicatorsContainer = document.getElementById('photo-indicators');
                this.currentIndex = 0;
                this.autoPlayInterval = null;
                this.autoPlayDelay = 5000; // 5秒切换一次
                this.photos = [
                    // 这里添加你们的合照URL
                    '6.jpg',
                    '7.jpg',
                    '3.jpg',
                    '4.jpg',
                    '5.jpg',
                ];

                this.init();
            }

            init() {
                this.createSlides();
                this.createIndicators();
                this.bindEvents();
                this.showSlide(0);
                this.startAutoPlay();
            }

            createSlides() {
                this.photos.forEach((photoUrl, index) => {
                    const slide = document.createElement('div');
                    slide.className = 'photo-slide';
                    slide.style.backgroundImage = `url('${photoUrl}')`;
                    slide.dataset.index = index;
                    this.container.appendChild(slide);
                });
            }

            createIndicators() {
                this.photos.forEach((_, index) => {
                    const indicator = document.createElement('div');
                    indicator.className = 'photo-indicator';
                    indicator.dataset.index = index;
                    if (index === 0) {
                        indicator.classList.add('active');
                    }
                    indicator.addEventListener('click', () => {
                        this.showSlide(index);
                    });
                    this.indicatorsContainer.appendChild(indicator);
                });
            }

            bindEvents() {
                const prevBtn = document.getElementById('prev-btn');
                const nextBtn = document.getElementById('next-btn');

                prevBtn.addEventListener('click', () => {
                    this.prevSlide();
                });

                nextBtn.addEventListener('click', () => {
                    this.nextSlide();
                });

                // 键盘控制
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'ArrowLeft') {
                        this.prevSlide();
                    } else if (e.key === 'ArrowRight') {
                        this.nextSlide();
                    }
                });

                // 鼠标悬停时暂停自动播放
                this.container.addEventListener('mouseenter', () => {
                    this.pauseAutoPlay();
                });

                this.container.addEventListener('mouseleave', () => {
                    this.startAutoPlay();
                });

                // 触摸控制
                let touchStartX = 0;
                let touchEndX = 0;

                this.container.addEventListener('touchstart', (e) => {
                    touchStartX = e.changedTouches[0].screenX;
                });

                this.container.addEventListener('touchend', (e) => {
                    touchEndX = e.changedTouches[0].screenX;
                    this.handleSwipe(touchStartX, touchEndX);
                });
            }

            handleSwipe(startX, endX) {
                const swipeThreshold = 50;
                const diff = startX - endX;

                if (Math.abs(diff) > swipeThreshold) {
                    if (diff > 0) {
                        this.nextSlide();
                    } else {
                        this.prevSlide();
                    }
                }
            }

            showSlide(index) {
                // 边界检查
                if (index < 0) index = this.photos.length - 1;
                if (index >= this.photos.length) index = 0;

                // 隐藏当前幻灯片
                const currentSlide = this.container.querySelector('.photo-slide.active');
                if (currentSlide) {
                    currentSlide.classList.remove('active');
                }

                // 更新指示器
                const currentIndicator = this.indicatorsContainer.querySelector('.photo-indicator.active');
                if (currentIndicator) {
                    currentIndicator.classList.remove('active');
                }

                // 显示新幻灯片
                const slides = this.container.querySelectorAll('.photo-slide');
                slides[index].classList.add('active');

                const indicators = this.indicatorsContainer.querySelectorAll('.photo-indicator');
                indicators[index].classList.add('active');

                this.currentIndex = index;

                // 重置自动播放计时器
                this.resetAutoPlay();
            }

            nextSlide() {
                this.showSlide(this.currentIndex + 1);
            }

            prevSlide() {
                this.showSlide(this.currentIndex - 1);
            }

            startAutoPlay() {
                this.autoPlayInterval = setInterval(() => {
                    this.nextSlide();
                }, this.autoPlayDelay);
            }

            pauseAutoPlay() {
                if (this.autoPlayInterval) {
                    clearInterval(this.autoPlayInterval);
                    this.autoPlayInterval = null;
                }
            }

            resetAutoPlay() {
                this.pauseAutoPlay();
                this.startAutoPlay();
            }
        }

        /**
         * 程序入口 (Main Entry)
         */
        window.onload = function () {
            // 初始化场景
            const slideshow = new PhotoSlideshow();
            const scene = new SceneManager();

            // 初始化计时器
            initTimer();

                "background: #ff7eb3; color: #fff; padding: 5px 0; border-radius: 3px;",
                "color: #ff7eb3; font-weight: bold;");
        };

    </script>
